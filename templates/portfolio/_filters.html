<form method="get" class="filter-bar"><div class="filter-label">VIEW OPTIONS</div><label>Currency {{ range_form.currency }}</label><label>From {{ range_form.start }}</label><label>To {{ range_form.end }}</label><button class="subtle-button">Apply filters</button><a class="reset-link" href="{{ request.path }}">Reset</a>{% if range_form.errors %}<div class="field-errors">{{ range_form.errors }}</div>{% endif %}</form>
{% if data_error %}<div class="message error"><strong>Valuation unavailable.</strong> {{ data_error }} <a href="{% url 'settings' %}">Manage data</a></div>{% endif %}
